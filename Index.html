<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>МайтИгра</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#2563eb,#1e3a8a);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      overflow:hidden;
    }

    .app{
      width:340px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .subtitle{
      opacity:0.8;
      margin-bottom:25px;
    }

    .level{
      margin-bottom:15px;
      font-size:18px;
    }

    .question{
      font-size:40px;
      font-weight:bold;
      margin:25px 0;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      font-size:22px;
      text-align:center;
      outline:none;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:15px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .check-btn{
      background:#22c55e;
      color:white;
    }

    .check-btn:hover{
      transform:scale(1.03);
    }

    .next-btn{
      background:#f59e0b;
      color:white;
    }

    .stats{
      display:flex;
      justify-content:space-between;
      margin-top:20px;
      font-size:18px;
    }

    .timer{
      margin-top:15px;
      font-size:22px;
      font-weight:bold;
    }

    .message{
      margin-top:15px;
      font-size:20px;
      min-height:24px;
    }
  </style>
</head>
<body>

<div class="app">
  <h1>🧮 МайтИгра</h1>

  <div class="subtitle">
    Тренируй математику каждый день
  </div>

  <div class="level" id="level">
    Уровень: 1
  </div>

  <div class="question" id="question">
    5 + 3
  </div>

  <input type="number" id="answer" placeholder="Введите ответ">

  <button class="check-btn" onclick="checkAnswer()">
    Проверить
  </button>

  <button class="next-btn" onclick="generateQuestion()">
    Следующий пример
  </button>

  <div class="message" id="message"></div>

  <div class="timer" id="timer">
    ⏳ 30
  </div>

  <div class="stats">
    <div>⭐ Очки: <span id="score">0</span></div>
    <div>🔥 Рекорд: <span id="best">0</span></div>
  </div>
</div>

<script>
let num1;
let num2;
let correct;
let score = 0;
let level = 1;
let time = 30;

const best = localStorage.getItem("bestScore") || 0;
document.getElementById("best").innerText = best;

function generateQuestion(){
  num1 = Math.floor(Math.random() * (10 * level));
  num2 = Math.floor(Math.random() * (10 * level));

  correct = num1 + num2;

  document.getElementById("question").innerText = `${num1} + ${num2}`;
  document.getElementById("answer").value = "";
  document.getElementById("message").innerText = "";
}

function checkAnswer(){
  const user = Number(document.getElementById("answer").value);

  if(user === correct){
    score++;

    document.getElementById("message").innerText = "✅ Правильно!";

    if(score % 5 === 0){
      level++;
      document.getElementById("level").innerText = `Уровень: ${level}`;
    }
  }else{
    document.getElementById("message").innerText = `❌ Ответ: ${correct}`;
  }

  document.getElementById("score").innerText = score;

  if(score > best){
    localStorage.setItem("bestScore", score);
    document.getElementById("best").innerText = score;
  }

  setTimeout(generateQuestion, 1000);
}

setInterval(() => {
  time--;

  document.getElementById("timer").innerText = `⏳ ${time}`;

  if(time <= 0){
    alert(`Игра окончена! Очки: ${score}`);

    time = 30;
    score = 0;
    level = 1;

    document.getElementById("score").innerText = score;
    document.getElementById("level").innerText = `Уровень: ${level}`;
  }
},1000);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js');
}

generateQuestion();
</script>

</body>
  </html>
